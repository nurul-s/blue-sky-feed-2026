<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MBIP Malaysia Combined Feed</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: transparent;
    margin: 0;
    padding: 0;
  }

  #feed-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 10px;
  }

  .feed-item {
    background: rgba(255, 255, 255, 0.0);
    border: none;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 6px;
  }

  .feed-item a {
    text-decoration: none;
    color: #1a0dab;
    font-weight: bold;
    font-size: 15px;
  }

  .feed-item small {
    display: block;
    color: #555;
    font-size: 12px;
    margin-top: 4px;
  }

  #loading {
    text-align: center;
    color: #333;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div id="feed-container">
  <div id="loading">Loading MBIP Malaysia feed...</div>
</div>

<script>
// RSS feeds to combine
const rssFeeds = [
  "https://www.reddit.com/r/malaysia/search.rss?q=MBIP&restrict_sr=1",
  "https://news.google.com/rss/search?q=MBIP&hl=en-MY&gl=MY&ceid=MY:en"
];

// Fetch a single RSS feed using rss2json
async function fetchRSS(url) {
  const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
  const data = await res.json();
  return data.items;
}

// Fetch and display combined feed
async function fetchCombinedFeed() {
  try {
    const allItems = [];
    for (const feed of rssFeeds) {
      const items = await fetchRSS(feed);
      allItems.push(...items);
    }

    // Sort by newest first
    allItems.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

    const container = document.getElementById("feed-container");
    container.innerHTML = "";

    allItems.forEach(item => {
      const div = document.createElement("div");
      div.className = "feed-item";
      div.innerHTML = `
        <a href="${item.link}" target="_blank">${item.title}</a>
        <small>${new Date(item.pubDate).toLocaleString()}</small>
        ${item.link.includes("reddit.com") ? `<a href="${item.link}" target="_blank">View Comments</a>` : ""}
      `;
      container.appendChild(div);
    });

  } catch (err) {
    const container = document.getElementById("feed-container");
    container.innerHTML = "<p>Unable to load feed.</p>";
    console.error(err);
  }
}

// Initial load
fetchCombinedFeed();
// Refresh every 5 minutes
setInterval(fetchCombinedFeed, 5 * 60 * 1000);
</script>

</body>
</html>
