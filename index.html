<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MBIP Live Feed</title>
<style>
  body { font-family: Arial, sans-serif; background: #f5f8fa; margin:0; padding:20px; }
  h2 { text-align:center; color:#333; margin-bottom:20px; }
  #feed { max-width:600px; margin:0 auto; }
  .feed-item { background:#fff; border-radius:10px; padding:12px; margin-bottom:12px; border:1px solid #ddd; box-shadow:0 1px 2px rgba(0,0,0,0.1); }
  .feed-item a { color:#1a0dab; text-decoration:none; font-weight:bold; font-size:15px; }
  .feed-item small { display:block; color:#555; font-size:12px; margin-top:4px; }
</style>
</head>
<body>

<h2>MBIP Feed</h2>
<div id="feed">Loading feed...</div>

<script>
// Replace this with any RSS feed URL (Reddit search, Google News, etc.)
const rssURL = "https://www.reddit.com/search.rss?q=MBIP";

async function fetchFeed() {
  try {
    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssURL)}`);
    const data = await res.json();
    const container = document.getElementById("feed");
    container.innerHTML = "";

    data.items.forEach(item => {
      const div = document.createElement("div");
      div.className = "feed-item";
      div.innerHTML = `
        <a href="${item.link}" target="_blank">${item.title}</a>
        <small>${new Date(item.pubDate).toLocaleString()}</small>
      `;
      container.appendChild(div);
    });
  } catch (err) {
    document.getElementById("feed").innerHTML = "<p>Unable to load feed.</p>";
    console.error(err);
  }
}

// Load feed on page load
fetchFeed();
// Refresh every 5 minutes
setInterval(fetchFeed, 5 * 60 * 1000);
</script>

</body>
</html>
