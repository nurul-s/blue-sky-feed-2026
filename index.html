<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MBIP Malaysia Feed</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: transparent; /* Transparent background */
    margin: 0;
    padding: 0;
  }

  #feed-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 10px;
  }

  .feed-item {
    background: rgba(255, 255, 255, 0.0); /* Transparent feed items */
    border: none;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 6px;
  }

  .feed-item a {
    text-decoration: none;
    color: #1a0dab;
    font-weight: bold;
    font-size: 15px;
  }

  .feed-item small {
    display: block;
    color: #555;
    font-size: 12px;
    margin-top: 4px;
  }

  #loading {
    text-align: center;
    color: #333;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div id="feed-container">
  <div id="loading">Loading MBIP Malaysia feed...</div>
</div>

<script>
// Reddit RSS feed for r/malaysia, searching for MBIP
const rssURL = "https://www.reddit.com/r/malaysia/search.rss?q=MBIP&restrict_sr=1";

async function fetchFeed() {
  try {
    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssURL)}`);
    const data = await res.json();
    const container = document.getElementById("feed-container");
    container.innerHTML = "";

    data.items.forEach(item => {
      const div = document.createElement("div");
      div.className = "feed-item";
      div.innerHTML = `
        <a href="${item.link}" target="_blank">${item.title}</a>
        <small>${new Date(item.pubDate).toLocaleString()}</small>
        <a href="${item.link}" target="_blank">View Comments</a> <!-- Link to comments -->
      `;
      container.appendChild(div);
    });
  } catch (err) {
    const container = document.getElementById("feed-container");
    container.innerHTML = "<p>Unable to load feed.</p>";
    console.error(err);
  }
}

// Initial load
fetchFeed();
// Refresh every 5 minutes
setInterval(fetchFeed, 5 * 60 * 1000);
</script>

</body>
</html>
